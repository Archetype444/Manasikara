name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set repository metadata
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: python3 tools/set_repository.py --url "$REPOSITORY_URL"
      - name: Test
        run: node --test tests/regression.test.js
      - name: Package
        run: python3 tools/package.py --chime brass --meditation mudita --finish bowl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wox-plugin
          path: deliverables/*.wox
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wox-plugin
          path: deliverables
      - name: Publish tested package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/publish_release.js

